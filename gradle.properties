# Phone-safe defaults also apply to the Play button's direct Gradle invocation.
org.gradle.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=384m -XX:ActiveProcessorCount=2 -XX:+UseSerialGC -Dfile.encoding=UTF-8
org.gradle.workers.max=1
org.gradle.vfs.watch=false
org.gradle.internal.instrumentation.agent=false
kotlin.compiler.execution.strategy=in-process
android.builder.sdkDownload=false
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
